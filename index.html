.dial-wrap { position: relative; width: min(100%, 380px); margin: 0 auto; }
.dial { width: 100%; height: auto; display: block; }
.hub { position: absolute; inset: 24% 16% 22%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.badge { margin: 0 0 4px; padding: 3px 8px; border-radius: 999px; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #fffaf3; }
.badge.after { background: var(--after); }
.badge.before { background: var(--before); }
.badge.at { background: #314232; }
.badge.elapsed { background: var(--ink); }
.badge.fence { background: #6d4d12; }
.hub-n, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
.hub-n { font-size: clamp(0.78rem, 2vw, 1.15rem); margin: 0; font-weight: 650; }
dl { display: grid; grid-template-columns: 11rem 1fr; gap: 5px 10px; margin: 8px 0 0; }
dt { color: var(--muted); }
dd { margin: 0; }
.exact { font-size: 1.25rem; font-weight: 650; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 10px; }
label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
input, select, button { font: inherit; color: var(--ink); background: #fff; border: 1px solid #c9bba6; border-radius: 8px; min-height: 44px; padding: 8px 10px; }
button { background: var(--ink); color: var(--paper); cursor: pointer; }
.callout { border-left: 4px solid var(--sand); background: #f8f0dc; padding: 8px 10px; margin: 8px 0; }
.callout.kush { border-left-color: #7a3b2e; background: #f6e7e1; }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; font-size: 0.78rem; margin: 0 4px 4px 0; background: #fff; }
.table-scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; min-width: 36rem; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
th { background: #f7f1e6; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (max-width: 800px) {
